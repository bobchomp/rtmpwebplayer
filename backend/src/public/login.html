<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login - RTMP Web Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="stylesheet" href="/style.css">
<style>
  .login-wrap { max-width: 900px; margin: 0 auto; padding: 28px 24px; position: relative; z-index: 1; }
  .login-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .login-nav .secondary { padding: 8px 14px; font-size: 13px; }

  /* A faint band of light drifting across the page - evokes a signal
     sweeping in and locking on, without being loud enough to distract
     from the actual form. */
  .signal-sweep {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 42%, rgba(31, 111, 100, .07) 50%, transparent 58%);
    background-size: 220% 220%;
    background-position: 0% 0%;
  }

  /* The wordmark icon is a broadcast glyph (arcs + a dot) - animating it
     to ripple outward from the dot reads as "actively transmitting". */
  @keyframes signal-ping { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  @keyframes dot-ping { 0%, 100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
  .login-nav .wm-dot { transform-box: fill-box; transform-origin: center; }

  .login-box { position: relative; z-index: 1; }

  @media (prefers-reduced-motion: no-preference) {
    .signal-sweep { animation: signal-sweep-move 11s ease-in-out infinite; }
    .login-nav .wm-arc-1 { animation: signal-ping 2.6s ease-in-out infinite; animation-delay: .5s; }
    .login-nav .wm-arc-2 { animation: signal-ping 2.6s ease-in-out infinite; animation-delay: .25s; }
    .login-nav .wm-arc-3 { animation: signal-ping 2.6s ease-in-out infinite; }
    .login-nav .wm-dot { animation: dot-ping 2.6s ease-in-out infinite; }
    .login-box.reveal { animation: card-reveal .5s ease both; }
  }
  @keyframes signal-sweep-move {
    0% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
  }
  @keyframes card-reveal {
    from { opacity: 0; transform: translateY(6px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
</head>
<body>

<div class="signal-sweep" aria-hidden="true"></div>

<div class="login-wrap">
  <nav class="login-nav">
    <span class="wordmark">
      <svg class="wordmark-icon" viewBox="0 0 32 32" aria-hidden="true">
        <path class="wm-arc wm-arc-1" d="M9 9 A16 16 0 0 1 25 25"/>
        <path class="wm-arc wm-arc-2" d="M9 14 A11 11 0 0 1 20 25"/>
        <path class="wm-arc wm-arc-3" d="M9 19 A6 6 0 0 1 15 25"/>
        <circle class="wm-dot" cx="9" cy="25" r="2.6"/>
      </svg>
      <span class="wordmark-text">RTMP <b>Web Player</b></span>
    </span>
    <a href="/" class="secondary">&larr; Back to site</a>
  </nav>
</div>

<form id="login-form" class="login-box hidden">
  <label>Username
    <input type="text" id="login-username" autocomplete="username" required>
  </label>
  <label>Password
    <input type="password" id="login-password" autocomplete="current-password" required>
  </label>
  <div id="login-error" class="error hidden"></div>
  <button type="submit">Log in</button>
</form>

<script src="/login.js"></script>
</body>
</html>
