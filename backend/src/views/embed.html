<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>__CHANNEL_NAME__ - Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: relative; width: 100vw; height: 100vh; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
  #cover {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #111;
  }
  #cover-img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: none;
  }
  #cover-text {
    position: relative; z-index: 1; color: #ccc;
    font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: rgba(0, 0, 0, .55); padding: 8px 14px; border-radius: 20px;
  }
  #live-badge {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    background: #e11d2e; color: #fff;
    font: 600 12px/1 -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 5px 9px; border-radius: 4px; letter-spacing: .04em;
    display: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="live-badge">LIVE</div>
  <video id="video" playsinline muted controls></video>
  <div id="cover">
    <img id="cover-img" src="" alt="">
    <div id="cover-text">Offline</div>
  </div>
</div>
<script src="/vendor/hls.min.js"></script>
<script>
(function () {
  var channelId = "__CHANNEL_ID__";
  var video = document.getElementById('video');
  var cover = document.getElementById('cover');
  var coverImg = document.getElementById('cover-img');
  var coverText = document.getElementById('cover-text');
  var liveBadge = document.getElementById('live-badge');
  var streamUrl = '/live/' + channelId + '/index.m3u8';

  var hls = null;
  var currentlyLive = false;
  var lastCoverUrl = null;

  function showOffline() {
    currentlyLive = false;
    video.style.display = 'none';
    liveBadge.style.display = 'none';
    cover.style.display = 'flex';
    video.removeAttribute('src');

    if (hls) {
      hls.destroy();
      hls = null;
    }

    if (lastCoverUrl) {
      coverImg.src = lastCoverUrl;
      coverImg.style.display = 'block';
      coverText.style.display = 'none';
    } else {
      coverImg.style.display = 'none';
      coverText.style.display = 'block';
    }
  }

  function showLive() {
    currentlyLive = true;
    cover.style.display = 'none';
    video.style.display = 'block';
    liveBadge.style.display = 'block';

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ liveDurationInfinity: true, backBufferLength: 30 });
      hls.on(Hls.Events.ERROR, function (event, data) {
        if (data && data.fatal) showOffline();
      });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play().catch(function () {});
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.play().catch(function () {});
    } else {
      showOffline();
      coverText.textContent = 'Your browser cannot play this stream.';
    }
  }

  function poll() {
    fetch('/api/channels/' + channelId + '/status', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        lastCoverUrl = data.coverUrl;

        if (data.isLive && !currentlyLive) {
          showLive();
        } else if (!data.isLive) {
          showOffline();
        }
      })
      .catch(function () {});
  }

  showOffline();
  poll();
  setInterval(poll, 5000);
})();
</script>
</body>
</html>
