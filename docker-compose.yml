# The dev/staging deployment - a fully separate docker-compose project from
# production (its own folder, its own checkout of the `dev` branch, its own
# .env, its own data volumes - nothing shared except the caddy-shared
# network below, which lets the *production* Caddy instance reach this
# stack's dev-backend to serve dev.stream.rossmackenzie.co.uk). See
# README's "Dev/staging deployment" for the full setup.
#
# Same per-service mem_limit reasoning as production's docker-compose.yml -
# budgeted against this droplet's total RAM alongside the production stack,
# which is still running on the same box.
services:
  dev-rtmp:
    build: ./rtmp
    # Without this Compose prefixes the folder name too, giving the
    # redundant "rtmpwebplayer-dev-dev-rtmp-1".
    container_name: dev-rtmp
    restart: unless-stopped
    mem_limit: 150m
    ports:
      - "1936:1935" # separate from production's 1935 - point a *second* OBS profile here
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    volumes:
      - dev_hls_data:/tmp/hls
      - dev_recordings_data:/recordings
    networks:
      - internal

  dev-backend:
    build: ./backend
    container_name: dev-backend
    restart: unless-stopped
    mem_limit: 200m
    environment:
      IS_DEV_SITE: "true"
      # Reuses the same Auth0 application/tenant as production (same person
      # logs into both) - just needs this domain's own callback URL added
      # to that application's Allowed Callback URLs list in the Auth0
      # dashboard, since the domain differs from production's.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_CALLBACK_URL: ${AUTH0_CALLBACK_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # Reuses the same RESTREAM_CLIENT_ID/SECRET as production - just needs
      # this domain's own callback URL added to that Restream app's allowed
      # redirect URIs.
      RESTREAM_CLIENT_ID: ${RESTREAM_CLIENT_ID:-}
      RESTREAM_CLIENT_SECRET: ${RESTREAM_CLIENT_SECRET:-}
      RESTREAM_REDIRECT_URI: ${RESTREAM_REDIRECT_URI:-}
      SESSION_SECRET: ${SESSION_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      PUBLIC_HOST: ${PUBLIC_HOST}
      RTMP_PUBLIC_HOST: ${RTMP_PUBLIC_HOST:-}
      RTMP_PORT: "1936"
      HLS_INTERNAL_URL: "http://dev-rtmp:8080"
      PORT: "4000"
      # YouTube relaying is dev-site-only by design (see index.js/rtmpHooks.js
      # checking IS_DEV_SITE) - this is the one place it actually takes effect.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ALLOWED_EMBED_DOMAINS: ${ALLOWED_EMBED_DOMAINS:-}
      GEOIP_LICENSE_KEY: ${GEOIP_LICENSE_KEY:-}
      LIVE_DELAY_MS: ${LIVE_DELAY_MS:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      RECORDINGS_ENABLED: ${RECORDINGS_ENABLED:-}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-}
      RECORDING_WARN_HOURS: ${RECORDING_WARN_HOURS:-}
      RECORDING_GRACE_MINUTES: ${RECORDING_GRACE_MINUTES:-}
    volumes:
      - dev_backend_data:/app/data
      - dev_backend_uploads:/app/uploads
      - dev_recordings_data:/recordings
    depends_on:
      - dev-rtmp
    networks:
      internal:
        # rtmp/nginx.conf.template hardcodes its webhooks to http://backend:4000.
        # Aliased on this project's own internal network only - never on
        # caddy-shared, where "backend" would be ambiguous for Caddy, which
        # also sees production's backend by that name.
        aliases:
          - backend
      # So production's Caddy (a completely separate compose project) can
      # still reach this container by name - see docker-compose.yml's own
      # caddy service and caddy/Caddyfile in the production folder.
      caddy-shared: {}

networks:
  internal:
  caddy-shared:
    external: true

volumes:
  dev_hls_data:
  dev_backend_data:
  dev_backend_uploads:
  dev_recordings_data:
