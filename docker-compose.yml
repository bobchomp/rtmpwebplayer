services:
  rtmp:
    build: ./rtmp
    restart: unless-stopped
    ports:
      - "1935:1935" # RTMP ingest - point Restream's Custom RTMP destination here
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    volumes:
      - hls_data:/tmp/hls
      - recordings_data:/recordings
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000" # direct access for local testing; put Caddy in front for production
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      PUBLIC_HOST: ${PUBLIC_HOST}
      RTMP_PUBLIC_HOST: ${RTMP_PUBLIC_HOST:-}
      RTMP_PORT: "1935"
      HLS_INTERNAL_URL: "http://rtmp:8080"
      PORT: "4000"
      # YouTube deliberately left unconfigured on production for now - its
      # OAuth scope is only being exercised on the dev stack below, per
      # Google's own guidance not to run an unverified scope against real
      # production traffic. Re-add these three once verification is done.
      # GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ALLOWED_EMBED_DOMAINS: ${ALLOWED_EMBED_DOMAINS:-}
      GEOIP_LICENSE_KEY: ${GEOIP_LICENSE_KEY:-}
      LIVE_DELAY_MS: ${LIVE_DELAY_MS:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - recordings_data:/recordings
    depends_on:
      - rtmp
    networks:
      - internal

  # Staging/dev copy of the two services above, sharing this same droplet and
  # Caddy instance (see caddy/Caddyfile's second site block) but with its own
  # domain, RTMP port, and data volumes, so it's a genuinely separate app to
  # test against - nothing here is reachable from, or shares data with, the
  # production stack.
  dev-rtmp:
    build: ./rtmp
    restart: unless-stopped
    ports:
      - "1936:1935" # separate from production's 1935 - point a *second* OBS profile here
    environment:
      WEBHOOK_SECRET: ${DEV_WEBHOOK_SECRET:-}
    volumes:
      - dev_hls_data:/tmp/hls
      - dev_recordings_data:/recordings
    networks:
      - internal

  dev-backend:
    build: ./backend
    restart: unless-stopped
    environment:
      IS_DEV_SITE: "true"
      ADMIN_USERNAME: ${DEV_ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
      SESSION_SECRET: ${DEV_SESSION_SECRET:-}
      WEBHOOK_SECRET: ${DEV_WEBHOOK_SECRET:-}
      PUBLIC_HOST: ${DEV_PUBLIC_HOST:-}
      RTMP_PUBLIC_HOST: ${RTMP_PUBLIC_HOST:-}
      RTMP_PORT: "1936"
      HLS_INTERNAL_URL: "http://dev-rtmp:8080"
      PORT: "4000"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${DEV_GOOGLE_REDIRECT_URI:-}
      ALLOWED_EMBED_DOMAINS: ${DEV_ALLOWED_EMBED_DOMAINS:-}
      GEOIP_LICENSE_KEY: ${GEOIP_LICENSE_KEY:-}
      LIVE_DELAY_MS: ${LIVE_DELAY_MS:-}
      R2_ACCOUNT_ID: ${DEV_R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${DEV_R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${DEV_R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${DEV_R2_BUCKET_NAME:-}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-}
    volumes:
      - dev_backend_data:/app/data
      - dev_backend_uploads:/app/uploads
      - dev_recordings_data:/recordings
    depends_on:
      - dev-rtmp
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - dev-backend
    networks:
      - internal

networks:
  internal:

volumes:
  hls_data:
  backend_data:
  backend_uploads:
  recordings_data:
  caddy_data:
  caddy_config:
  dev_hls_data:
  dev_backend_data:
  dev_backend_uploads:
  dev_recordings_data:
